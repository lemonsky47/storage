name: Mirror upstream into storage branch

on:
  schedule:
    - cron: "0 0 * * *"   # once per day
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (main branch with workflow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/freebuisness/html.git

      - name: Fetch upstream
        run: |
          git fetch upstream --prune

      - name: Update storage branch
        run: |
          git checkout -B storage upstream/main
          git push origin storage --force
